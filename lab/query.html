<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网上样片查询｜春光数码冲印</title><link rel="stylesheet" href="../assets/site.css"></head><body class="lab-site"><div class="lab-wrap"><header class="lab-head"><div><div class="lab-logo">春光数码冲印</div><div class="lab-subline">城西路28号　胶卷冲洗 · 数码照片 · 扫描底片 · 证件快照</div></div><div class="lab-badge">冲得清楚，再来取</div></header><nav class="lab-menu"><a href="../lab/index.html">门店首页</a><a href="../lab/services.html">价目 / 服务</a><a href="../lab/query.html">网上样片查询</a><a href="../lab/orders.html">取件说明</a></nav><main class="lab-main"><h1>网上样片查询</h1><p class="lab-text">请输入取件袋右上角的批次号。门店批次号格式为 <span class="kbd">SG-YYMMDD-###</span>，字母不区分大小写。公开活动批次仍可查看，私人订单已经关闭。</p><form class="query-form lab-query" data-puzzle="lab" data-success="../lab/20060819.html"><label for="lab-code">冲印批次号</label><div><input id="lab-code" name="code" autocomplete="off" placeholder="SG-YYMMDD-###" maxlength="13"><button type="submit">查询</button></div><p class="form-msg" aria-live="polite"></p></form><div class="lab-notice"><b>旧站提示：</b>如果批次号来自合作单位相册，请按相册页记录的完整编号输入，不要只输入日期。</div><h2>常见问题</h2><p class="lab-text">查询不到通常有三种情况：号码抄错、订单属于私人顾客、或门店在顾客取件后已经清理了网上样片。纸质照片本身不受影响。</p></main><footer class="site-footer">春光数码冲印店 · 城西路28号（旧址）　页面为历史备份，在线下单功能已停用。</footer></div><div class="viewer"><button type="button">关闭</button><img alt="放大照片"></div><script src="../assets/game.js"></script></body></html>
