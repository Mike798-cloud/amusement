<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>到这里就结束了｜春灯闭园以后</title><link rel="stylesheet" href="../assets/site.css"></head><body class="thanks-site"><main class="thanks-wrap"><div class="thanks-photo"><img src="../assets/img/story_photos/park_night_unique.jpg" alt="春灯游乐园旧夜场照片"></div><section class="thanks-copy"><div class="thanks-kicker">CHUNDENG / 2003—2006</div><h1>到这里就结束了。</h1><p>谢谢你把这些旧网页一页一页翻到这里。</p><p>前面那些帖子、退票单、维修编号和拍坏的照片，有些有用，有些其实什么也说明不了。你愿意真的看完，它们才不只是摆在页面里的旧东西。</p><p>沈荞、唐屿、沈栀和春灯游乐园都是虚构的。现实里没有哪一家游乐园、哪一个人需要为这个故事负责。</p><p>如果关掉页面以后，你还偶尔会想起那句“别关门”，或者那条被嫌弃很丑的绿色手链，就已经够了。</p><p class="thanks-last">谢谢你玩到这里。</p><div class="thanks-rule"></div><div class="thanks-old">春灯游乐园祝您天天开心。</div><a class="thanks-return" href="../index.html">回到最初那则新闻</a></section></main><script src="../assets/game.js"></script></body></html>
