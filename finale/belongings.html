<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夹层里的东西</title><link rel="stylesheet" href="../assets/site.css"></head><body class="finale-site"><div class="final-shell"><header class="final-head"><div class="small muted">沈荞失踪案 · 2026年补充公开材料</div><h1>夹层里的东西</h1></header><main class="final-main"><p>夹层里没有遗书。沈荞显然不知道自己会死在那里。她把吃剩的一半饼干重新折好，把湿袜子搭在管道上晾，把书包放在高一点的铁架上。那张游乐园地图被垫在相对干燥的地面。</p><div class="evidence-box"><p>地图背面有两行铅笔字，字迹因为水汽已经很淡：</p><p style="text-indent:2em">“回去别告诉妈我自己跑进来了。手链先不给她，看她还生不生气。”</p></div><p>这两行字无法确定写于几点。调查人员只能确认，纸张位于最高积水线以上，而她后来没有再离开夹层。</p><img class="letter-photo" src="../assets/img/green_bracelet.jpg" alt="绿色玻璃手链"><p>沈栀后来对记者说，那条手链其实很便宜，她小时候在摊位前看过很久，最后嫌贵没有买。沈荞大概只是记住了这件事。</p><p><a class="quiet-link" href="index.html">返回补充材料</a></p></main></div><div class="viewer"><button type="button">关闭</button><img alt="放大照片"></div><script src="../assets/game.js"></script></body></html>
